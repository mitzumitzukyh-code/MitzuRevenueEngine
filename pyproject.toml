[project]
name = "mitzu-revenue-engine"
version = "0.1.0"
description = "Autonomous revenue opportunity engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "psycopg[binary]>=3.2"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
