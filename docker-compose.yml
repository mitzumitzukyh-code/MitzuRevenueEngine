services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
      AUTONOMOUS_EXECUTION: "false"
      WALLET_ENABLED: "false"
    depends_on:
      - db
  scout:
    build: .
    command: ["python", "-m", "app.scout_main"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
      SCOUT_ENABLED: "true"
      SCOUT_INTERVAL_SECONDS: "900"
      AUTONOMOUS_EXECUTION: "false"
      WALLET_ENABLED: "false"
    depends_on:
      - db
    restart: unless-stopped
  market:
    build: .
    command: ["python", "-m", "app.market_main"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
      MARKET_SCAN_INTERVAL_SECONDS: "3600"
      AUTONOMOUS_EXECUTION: "false"
      WALLET_ENABLED: "false"
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - mitzu-db:/var/lib/postgresql/data
volumes:
  mitzu-db:
